[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-visual-rag"
version = "0.1.0"
description = "Video-native multimodal hybrid RAG system (no audio transcript). Phase 2 captions from OCR only; Phase 4 search/QA/rerank is powered by a single Qwen2.5-VL-3B-Instruct model (4-bit NF4, optional QLoRA)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pyright]
include = ["src", "main.py"]
extraPaths = ["."]
